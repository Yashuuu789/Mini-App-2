<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Base Vibe</title>
<meta name="fc:frame" content='{"version":"1","imageUrl":"https://basevibedaily.vercel.app/og.png","button":{"title":"Play BaseVibe","action":{"type":"launch_frame","name":"BaseVibe","url":"https://basevibedaily.vercel.app","splashBackgroundColor":"#020510"}}}' />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0052FF;--blue2:#1A6FFF;--bg:#020510;--s1:#080D1C;--s2:#0D1425;--s3:#121A30;--border:rgba(255,255,255,0.06);--border-hi:rgba(0,82,255,0.45);--text:#EEF2FF;--muted:#4A5880;--muted2:#7A8AB0;--gold:#FFBB00;--green:#00F0A0;--red:#FF3D6B;--purple:#A259FF;--font:'Outfit',sans-serif;--mono:'Space Grotesk',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.4}
.bg-glow{position:fixed;top:-120px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(0,82,255,0.1) 0%,transparent 65%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;padding-bottom:80px}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998;transition:opacity 0.5s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:90px;height:90px;border-radius:24px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,82,255,0.6);animation:splashPulse 1.5s ease-in-out infinite;margin-bottom:20px;overflow:hidden}
@keyframes splashPulse{0%,100%{box-shadow:0 0 40px rgba(0,82,255,0.5)}50%{box-shadow:0 0 80px rgba(0,82,255,0.8),0 0 120px rgba(0,82,255,0.3)}}
.splash-title{font-size:32px;font-weight:900;letter-spacing:-0.5px;margin-bottom:6px}
.splash-title span{color:#6B9FFF}
.splash-sub{font-size:13px;color:var(--muted);font-family:var(--mono)}
.splash-bar{width:120px;height:3px;background:var(--s3);border-radius:3px;margin-top:28px;overflow:hidden}
.splash-bar-fill{height:100%;background:var(--blue);border-radius:3px;animation:splashLoad 1.8s ease forwards}
@keyframes splashLoad{0%{width:0%}100%{width:100%}}
.offline-banner{background:rgba(255,61,107,0.1);border-bottom:1px solid rgba(255,61,107,0.2);padding:8px 16px;text-align:center;font-size:11px;font-weight:600;color:var(--red);font-family:var(--mono);display:none}
.offline-banner.show{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;background:rgba(2,5,16,0.92);backdrop-filter:blur(24px);z-index:100;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px}
.logo-sq{width:34px;height:34px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(0,82,255,0.5);flex-shrink:0;overflow:hidden}
.logo-name{font-weight:800;font-size:18px;letter-spacing:-0.3px}
.logo-name span{color:#6B9FFF}
.w-chip{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--border-hi);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:600;color:#6B9FFF;cursor:pointer;font-family:var(--mono)}
.w-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green)}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(8,13,28,0.97);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;z-index:100;padding:8px 0 max(12px,env(safe-area-inset-bottom))}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;border:none;background:none;color:var(--muted);font-family:var(--font);transition:color 0.2s}
.ni.active{color:var(--blue2)}
.ni-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.ni-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:filter 0.2s}
.ni.active .ni-ico svg{filter:drop-shadow(0 0 5px #4D8EFF)}
.ni-lbl{font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase}
.page{padding:18px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.card.hi{border-color:var(--border-hi);box-shadow:0 0 28px rgba(0,82,255,0.12)}
.card.gold{border-color:rgba(255,187,0,0.3);box-shadow:0 0 24px rgba(255,187,0,0.07)}
.card.purple{border-color:rgba(162,89,255,0.3);box-shadow:0 0 24px rgba(162,89,255,0.08)}
.xp-track{height:6px;background:var(--s3);border-radius:6px;overflow:hidden}
.xp-fill{height:100%;border-radius:6px;transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1)}
.xp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xp-level{font-size:12px;font-weight:700;color:var(--gold);font-family:var(--mono);display:flex;align-items:center;gap:4px}
.xp-pts{font-size:11px;color:var(--muted);font-family:var(--mono)}
.streak-hero{text-align:center;padding:20px 16px 14px}
.fire-num{font-size:72px;font-weight:900;line-height:1;letter-spacing:-4px;color:var(--gold);text-shadow:0 0 40px rgba(255,187,0,0.4)}
.fire-icon{width:32px;height:32px;flex-shrink:0;animation:fireWiggle 1.4s ease-in-out infinite}
@keyframes fireWiggle{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.15)}}
.fire-wrap{position:relative;display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
.streak-sub{color:var(--muted2);font-size:13px;font-weight:500;margin-top:2px;font-family:var(--mono)}
.srow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.sc{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:13px 8px;text-align:center}
.sc-n{font-size:24px;font-weight:800;color:var(--blue2);line-height:1;display:block;margin-bottom:3px}
.sc-l{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.vb{background:var(--s1);border:1.5px solid var(--border);border-radius:16px;padding:14px 6px 12px;cursor:pointer;text-align:center;transition:all 0.16s;font-family:var(--font)}
.vb:active{transform:scale(0.93)}
.vb.sel{border-color:var(--blue2);background:linear-gradient(135deg,rgba(0,82,255,0.14),rgba(0,82,255,0.05));box-shadow:0 0 18px rgba(0,82,255,0.2)}
.vi{display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.vn{font-size:9px;font-weight:700;letter-spacing:0.8px;color:var(--muted);text-transform:uppercase;display:block}
.vb.sel .vn{color:var(--blue2)}
.cin{background:linear-gradient(135deg,rgba(0,82,255,0.1),rgba(0,240,160,0.04));border:1.5px solid var(--border-hi);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:13px}
.cin-ico{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cv{font-size:16px;font-weight:800;display:block}
.cs{font-size:11px;font-weight:400;color:var(--muted);margin-top:3px;display:block;font-family:var(--mono)}
.btn{width:100%;padding:15px;border:none;border-radius:14px;color:white;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.16s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(0.97)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn-blue{background:var(--blue);box-shadow:0 4px 20px rgba(0,82,255,0.35)}
.btn-ghost{background:var(--s2);border:1px solid var(--border);color:var(--text);margin-top:9px}
.btn-purple{background:linear-gradient(135deg,#7B2FF7,#A259FF);box-shadow:0 4px 16px rgba(162,89,255,0.3)}
.btn-red{background:rgba(255,61,107,0.15);border:1px solid rgba(255,61,107,0.3);color:var(--red);margin-top:9px}
.btn-green{background:linear-gradient(135deg,#00C47A,#00F0A0);box-shadow:0 4px 16px rgba(0,240,160,0.3);color:#000}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.cban{background:linear-gradient(135deg,rgba(0,240,160,0.07),rgba(0,82,255,0.05));border:1px solid rgba(0,240,160,0.18);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:13px}
.cbi{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cbt{font-size:15px;font-weight:800;color:var(--green);display:block}
.cbs{font-size:11px;color:var(--muted);margin-top:3px;display:block;font-family:var(--mono)}
.combo-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(255,187,0,0.8);z-index:500;pointer-events:none;animation:comboAnim 0.9s ease forwards;font-family:var(--mono)}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(0.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(0.9)}}
.qhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qcnt{font-size:12px;font-weight:600;color:var(--muted);font-family:var(--mono)}
.qpts{font-size:13px;font-weight:700;color:var(--gold);font-family:var(--mono)}
.prog-track{height:4px;background:var(--s3);border-radius:4px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),#6B9FFF);border-radius:4px;transition:width 0.4s ease}
.qtxt{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:16px}
.diff-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:0.5px;margin-bottom:10px}
.diff-easy{background:rgba(0,240,160,0.12);color:var(--green)}
.diff-medium{background:rgba(255,187,0,0.12);color:var(--gold)}
.diff-hard{background:rgba(255,61,107,0.12);color:var(--red)}
.opts{display:flex;flex-direction:column;gap:9px}
.ob{padding:14px 15px;background:var(--s2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);text-align:left;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:11px;width:100%;transition:all 0.15s}
.ob:active{transform:scale(0.98)}
.ol{width:27px;height:27px;border-radius:7px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--muted);font-family:var(--mono)}
.ob.correct{border-color:var(--green);background:rgba(0,240,160,0.07)}
.ob.correct .ol{background:var(--green);color:#000}
.ob.wrong{border-color:var(--red);background:rgba(255,61,107,0.07)}
.ob.wrong .ol{background:var(--red);color:#fff}
.fact-box{margin-top:12px;padding:12px 14px;background:rgba(0,82,255,0.08);border:1px solid rgba(0,82,255,0.2);border-radius:10px;font-size:12px;font-weight:500;color:var(--muted2);line-height:1.6;font-family:var(--mono);display:none}
.qres{text-align:center;padding:8px}
.qres-score{font-size:64px;font-weight:900;letter-spacing:-3px;color:var(--gold);display:block}
.qres-lbl{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.qres-bk{display:flex;justify-content:center;gap:18px;margin:16px 0;padding:14px;background:var(--s2);border-radius:12px}
.bki{text-align:center}
.bkn{font-size:22px;font-weight:800;display:block}
.bks{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-top:3px}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.lbi{display:flex;align-items:center;gap:11px;padding:13px 15px;background:var(--s1);border:1px solid var(--border);border-radius:14px;margin-bottom:8px}
.lbi.me{border-color:var(--border-hi);background:linear-gradient(135deg,rgba(0,82,255,0.08),rgba(0,82,255,0.02))}
.lbr{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;background:var(--s2);color:var(--muted);font-family:var(--mono)}
.lbinfo{flex:1;min-width:0}
.lbn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lbd{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono);display:flex;align-items:center;gap:4px}
.lbp{font-size:16px;font-weight:800;color:var(--blue2);display:block;text-align:right}
.lbs{font-size:10px;color:var(--muted);text-align:right;font-family:var(--mono);display:block}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bc{background:var(--s1);border:1.5px solid var(--border);border-radius:14px;padding:15px 11px;text-align:center;opacity:0.3;transition:all 0.2s}
.bc.earned{opacity:1;border-color:rgba(255,187,0,0.3);background:linear-gradient(135deg,rgba(255,187,0,0.06),rgba(255,187,0,0.01));box-shadow:0 0 18px rgba(255,187,0,0.07)}
.bi{display:flex;align-items:center;justify-content:center;margin:0 auto 9px;width:36px;height:36px}
.bn{font-size:12px;font-weight:700;display:block;margin-bottom:2px}
.br{font-size:10px;font-weight:500;color:var(--muted);display:block}
.ref-link-box{background:var(--s2);border:1px solid rgba(162,89,255,0.3);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:12px;color:#A259FF;word-break:break-all;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ref-rewards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.ref-reward-card{background:var(--s2);border:1px solid var(--border);border-radius:13px;padding:13px 10px;text-align:center}
.rr-ico{display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.rr-pts{font-size:18px;font-weight:800;color:var(--gold);display:block;line-height:1}
.rr-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-top:3px}
.ref-count-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--s2);border:1px solid var(--border);border-radius:12px;margin-bottom:9px}
.ref-count-lbl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.ref-count-num{font-size:18px;font-weight:800;color:var(--purple)}
.ref-history{background:var(--s1);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px}
.rh-head{padding:14px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.rh-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.rh-item:last-child{border-bottom:none}
.rh-name{font-size:13px;font-weight:600}
.rh-addr{font-size:10px;color:var(--muted);font-family:var(--mono);display:block;margin-top:1px}
.rh-pts{font-size:13px;font-weight:700;color:var(--green)}
.phdr{text-align:center;padding:18px 20px 10px}
.pav{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,var(--blue),#6B9FFF);display:flex;align-items:center;justify-content:center;margin:0 auto 11px;box-shadow:0 0 24px rgba(0,82,255,0.4)}
.pname{font-size:21px;font-weight:800;letter-spacing:-0.3px;display:block}
.paddr{font-size:11px;color:var(--muted);margin-top:3px;display:block;font-family:var(--mono)}
.level-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(255,187,0,0.1);border:1px solid rgba(255,187,0,0.25);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--gold);margin-top:8px}
.hr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.hr:last-child{border-bottom:none}
.hrl{display:flex;align-items:center;gap:10px}
.hre{width:35px;height:35px;border-radius:9px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hrn{font-size:13px;font-weight:600;display:block}
.hrd{font-size:10px;color:var(--muted);font-family:var(--mono);display:block}
.cnx{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.cnx-logo{width:80px;height:80px;border-radius:22px;background:var(--blue);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 40px rgba(0,82,255,0.5);animation:logoPulse 2.5s ease-in-out infinite;overflow:hidden}
@keyframes logoPulse{0%,100%{box-shadow:0 0 40px rgba(0,82,255,0.5)}50%{box-shadow:0 0 60px rgba(0,82,255,0.7),0 0 100px rgba(0,82,255,0.2)}}
.feat-list{width:100%;max-width:320px;margin-bottom:28px}
.feat{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s1);border:1px solid var(--border);border-radius:12px;margin-bottom:7px;text-align:left}
.feat-ico{width:36px;height:36px;border-radius:9px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feat-ico svg{width:20px;height:20px;stroke:var(--blue2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feat-t{font-size:13px;font-weight:600;display:block}
.feat-s{font-size:11px;color:var(--muted);display:block}
.nsu{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;width:100%}
.txtin{width:100%;padding:15px;background:var(--s2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:var(--font);font-size:16px;font-weight:600;outline:none;transition:border 0.2s;margin-bottom:9px}
.txtin:focus{border-color:var(--blue2)}
.txtin::placeholder{color:var(--muted);font-weight:400}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--border-hi);border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;z-index:300;animation:tIn 0.3s ease,tOut 0.3s ease 2.2s forwards;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}}
@keyframes tOut{to{opacity:0;transform:translateX(-50%) translateY(-8px)}}
.tag{display:inline-flex;align-items:center;gap:5px;background:rgba(0,82,255,0.09);border:1px solid rgba(0,82,255,0.2);border-radius:99px;padding:4px 11px;font-size:11px;font-weight:600;color:#6B9FFF;margin-bottom:13px}
.tag-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.slbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:block}
.streak-freeze{background:linear-gradient(135deg,rgba(255,187,0,0.08),rgba(255,150,0,0.04));border:1px solid rgba(255,187,0,0.2);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sf-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.sf-sub{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.sf-btn{padding:8px 14px;background:rgba(255,187,0,0.15);border:1px solid rgba(255,187,0,0.3);border-radius:9px;color:var(--gold);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.challenge-card{background:linear-gradient(135deg,rgba(0,82,255,0.09),rgba(162,89,255,0.06));border:1px solid var(--border-hi);border-radius:16px;padding:16px;margin-top:12px}
.divider{height:1px;background:var(--border);margin:16px 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp 0.3s ease forwards}
.spin-sm{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-sheet{background:var(--s1);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:430px;animation:slideUp 0.25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:18px;font-weight:800;margin-bottom:8px;display:block}
.modal-sub{font-size:13px;color:var(--muted);font-family:var(--mono);display:block;margin-bottom:20px}
.modal-btn-row{display:flex;flex-direction:column;gap:9px}
/* ONBOARDING */
.ob-step{display:flex;align-items:flex-start;gap:14px;padding:14px;background:var(--s2);border:1px solid var(--border);border-radius:14px;margin-bottom:9px}
.ob-num{width:28px;height:28px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.ob-t{font-size:13px;font-weight:700;display:block;margin-bottom:2px}
.ob-s{font-size:11px;color:var(--muted);display:block}
/* SCORE CARD */
.score-card-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1001;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.score-card{background:linear-gradient(135deg,#0D1425,#080D1C);border:1px solid var(--border-hi);border-radius:24px;padding:28px 24px;width:100%;max-width:340px;text-align:center;position:relative;overflow:hidden}
.score-card::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(0,82,255,0.15),transparent 70%);pointer-events:none}
.sc-username{font-size:22px;font-weight:900;display:block;margin-bottom:4px}
.sc-score-big{font-size:72px;font-weight:900;color:var(--gold);display:block;letter-spacing:-3px;line-height:1;margin:16px 0 4px}
.sc-label{font-size:12px;color:var(--muted);font-family:var(--mono);display:block;margin-bottom:16px}
.sc-stats-row{display:flex;justify-content:center;gap:20px;margin:16px 0;padding:14px;background:rgba(255,255,255,0.03);border-radius:14px}
.sc-stat{text-align:center}
.sc-stat-n{font-size:20px;font-weight:800;display:block}
.sc-stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-top:2px}
.sc-url{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:12px;display:block}
</style>

  for(var i=shuffled.length-1;i>0;i--){var j=(seed*(i+1)*9301+49297)%233280;j=j%(i+1);var temp=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=temp;seed=j+seed;}
  return shuffled.slice(0,10);
}

async function connectWallet(){
  if(typeof window.ethereum==='undefined'){toast('Open in Coinbase Wallet!');return;}
  try{
    var btn=document.getElementById('connectBtn');
    if(btn){btn.disabled=true;btn.innerHTML='<div class="spin-sm"></div> Connecting…';}
    var acc=await window.ethereum.request({method:'eth_requestAccounts'});
    S.wallet=acc[0];
    localStorage.setItem('walletAddress',S.wallet);
    if(!S.referCode){S.referCode=genCode(S.wallet);saveLocal(['referCode']);}

    var urlParams=new URLSearchParams(window.location.search);
    var ref=urlParams.get('ref');
    if(ref&&ref!==S.referCode&&!S.referredBy){
      S.referredBy=ref;S.points+=50;saveLocal(['referredBy','points']);
      if(S.isOnline){var referrer=await sbGetUserByCode(ref);if(referrer){var newRefs=referrer.referrals||[];newRefs.push({name:S.username||sa(S.wallet),addr:sa(S.wallet),date:today()});await sbUpsert({wallet:referrer.wallet,username:referrer.username,points:(referrer.points||0)+25,streak:referrer.streak||0,referral_pts:(referrer.referral_pts||0)+25,referrals:newRefs,refer_code:referrer.refer_code,last_checkin:referrer.last_checkin||'',quizzes:referrer.quizzes||0,total_correct:referrer.total_correct||0,quiz_done:referrer.quiz_done||'',referred_by:referrer.referred_by||'',freeze_used:referrer.freeze_used||0,vibe_history:referrer.vibe_history||[]});}}
    }

    // Always reload local data first
    S.streak=parseInt(localStorage.getItem('streak')||'0');
    S.points=parseInt(localStorage.getItem('points')||'0');
    S.quizzes=parseInt(localStorage.getItem('quizzes')||'0');
    S.totalCorrect=parseInt(localStorage.getItem('totalCorrect')||'0');
    S.lastCheckin=localStorage.getItem('lastCheckin')||'';
    S.vibeHistory=JSON.parse(localStorage.getItem('vibeHistory')||'[]');
    S.quizDone=localStorage.getItem('quizDone')||'';
    S.username=localStorage.getItem('username')||'';
    S.referCode=localStorage.getItem('referCode')||'';
    S.referredBy=localStorage.getItem('referredBy')||'';
    S.referrals=JSON.parse(localStorage.getItem('referrals')||'[]');
    S.referralPts=parseInt(localStorage.getItem('referralPts')||'0');
    S.freezeUsed=parseInt(localStorage.getItem('freezeUsed')||'0');

    // Then sync with Supabase
    if(S.isOnline){
      var existing=await sbGet(S.wallet);
      if(existing&&existing.username){
        S.username=existing.username;
        S.streak=existing.streak||S.streak;
        S.points=existing.points||S.points;
        S.referralPts=existing.referral_pts||S.referralPts;
        S.quizzes=existing.quizzes||S.quizzes;
        S.totalCorrect=existing.total_correct||S.totalCorrect;
        S.lastCheckin=existing.last_checkin||S.lastCheckin;
        if(existing.vibe_history&&existing.vibe_history.length>0)S.vibeHistory=existing.vibe_history;
        S.quizDone=existing.quiz_done||S.quizDone;
        S.referCode=existing.refer_code||S.referCode;
        S.referredBy=existing.referred_by||S.referredBy;
        S.freezeUsed=existing.freeze_used||S.freezeUsed;
        if(existing.referrals&&existing.referrals.length>0)S.referrals=existing.referrals;
        saveLocal(['streak','points','quizzes','totalCorrect','lastCheckin','vibeHistory','quizDone','referCode','referredBy','referralPts','freezeUsed','referrals','username']);
      } else {
        await saveRemote();
      }
    }

    if(!S.username){renderNameSetup();}else{render();}
  }catch(e){console.error(e);toast('Connection failed');render();}
}

  h+='<span class="paddr">'+sa(S.wallet)+'</span>';
  h+='<div class="level-tag">'+icoSvg(lv.ico,'var(--gold)',12)+' '+lv.name+'</div>';
  h+='<button onclick="showChangeUsername()" style="margin-top:10px;background:var(--s2);border:1px solid var(--border);border-radius:99px;padding:6px 14px;color:var(--muted2);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px">'+icoSvg('edit','var(--muted2)',13)+' Change Name</button>';
  h+='</div>';
  h+='<div class="card" style="margin-bottom:12px"><div class="xp-row"><span class="xp-level">Level Progress</span><span class="xp-pts">'+totalPts+' / '+lv.next+'</span></div><div class="xp-track"><div class="xp-fill" style="width:'+lvPct+'%;background:linear-gradient(90deg,'+lv.color+','+lv.color+'88)"></div></div></div>';
  h+='<div class="srow"><div class="sc"><span class="sc-n">'+S.streak+'</span><span class="sc-l">Streak</span></div><div class="sc"><span class="sc-n">'+totalPts+'</span><span class="sc-l">Points</span></div><div class="sc"><span class="sc-n">'+S.quizzes+'</span><span class="sc-l">Quizzes</span></div></div>';
  h+='<div class="card"><span style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:block">Badges</span><div class="bgrid">';
  BADGES.forEach(function(b){var e=b.earned();h+='<div class="bc'+(e?' earned':'')+'"><div class="bi">'+icoSvg(b.ico,e?'var(--gold)':'var(--muted)',28)+'</div><span class="bn">'+b.n+'</span><span class="br">'+b.r+'</span></div>';});
  h+='</div></div>';
  h+='<div style="height:1px;background:var(--border);margin:16px 0"></div>';
  h+='<span style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:block">Refer & Earn</span>';
  h+='<div class="card purple"><span style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:block">Your Refer Code</span>';
  h+='<div style="font-size:24px;font-weight:900;letter-spacing:3px;color:#A259FF;font-family:var(--mono);margin-bottom:4px">'+S.referCode+'</div>';
  h+='<div class="ref-link-box" onclick="copyReferLink()"><span>'+getReferLink()+'</span>'+icoSvg('copy','var(--muted)',16)+'</div>';
  h+='<button class="btn btn-purple" onclick="shareReferLink()">'+icoSvg('share','white',18)+' Share My Link</button></div>';
  h+='<div class="ref-rewards">';
  [{k:'users',c:'#6B9FFF',pts:'+25 pts',lbl:'You get per referral'},{k:'gift',c:'#A259FF',pts:'+50 pts',lbl:'Friend gets on join'},{k:'fire',c:'#FFBB00',pts:'+10 pts',lbl:'Bonus at 7-day streak'},{k:'diamond',c:'#A259FF',pts:'2x pts',lbl:'Refer 10+ friends'}].forEach(function(r){h+='<div class="ref-reward-card"><div class="rr-ico">'+icoSvg(r.k,r.c,22)+'</div><span class="rr-pts">'+r.pts+'</span><span class="rr-lbl">'+r.lbl+'</span></div>';});
  h+='</div>';
  h+='<div class="ref-count-row"><span class="ref-count-lbl">'+icoSvg('users','var(--muted)',15)+' Friends Referred</span><span class="ref-count-num">'+S.referrals.length+'</span></div>';
  h+='<div class="ref-count-row" style="margin-bottom:12px"><span class="ref-count-lbl">'+icoSvg('coin','var(--muted)',15)+' Points Earned</span><span class="ref-count-num" style="color:var(--gold)">'+S.referralPts+'</span></div>';
  h+='<div class="ref-history"><div class="rh-head">Referred Friends</div>';
  if(S.referrals.length===0)h+='<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No referrals yet — share your link!</div>';
  else S.referrals.forEach(function(r){h+='<div class="rh-item"><div><span class="rh-name">'+r.name+'</span><span class="rh-addr">'+r.addr+'</span></div><span class="rh-pts">+25 pts</span></div>';});
  h+='</div>';
  if(S.referredBy)h+='<div style="padding:11px 14px;background:rgba(0,240,160,0.07);border:1px solid rgba(0,240,160,0.15);border-radius:11px;font-size:12px;font-weight:600;color:var(--green);margin-top:9px;font-family:var(--mono);display:flex;align-items:center;gap:7px">'+icoSvg('check','var(--green)',13)+' You joined via referral — +50 pts!</div>';
  h+='<div style="height:1px;background:var(--border);margin:16px 0"></div>';
  h+='<div class="card"><span style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:block">Vibe History</span>';
  if(S.vibeHistory.length===0)h+='<div style="text-align:center;padding:20px 0;color:var(--muted);font-size:13px">No vibes yet — check in!</div>';
  else S.vibeHistory.slice(0,8).forEach(function(v){var c=VIBE_COLORS[v.key]||'#6B9FFF';h+='<div class="hr"><div class="hrl"><div class="hre">'+icoSvg(v.key,c,18)+'</div><div><span class="hrn">'+v.name+'</span><span class="hrd">'+fmtDate(v.date)+'</span></div></div></div>';});
  h+='</div>';
  h+='<div style="height:1px;background:var(--border);margin:16px 0"></div>';
  h+='<button class="btn btn-red" onclick="confirmDisconnect()">'+icoSvg('logout','var(--red)',18)+' Disconnect Wallet</button>';
  return h+'</div>';
}

window.addEventListener('load',function(){
  var sl=document.getElementById('splashLogo');if(sl)sl.innerHTML=logoMark(54);
  setTimeout(function(){
    var splash=document.getElementById('splash');
    if(splash){splash.classList.add('hide');setTimeout(function(){splash.remove();},500);}
    var _ref=new URLSearchParams(window.location.search).get('ref');
    if(_ref&&S.wallet&&!S.referredBy&&_ref!==S.referCode){S.referredBy=_ref;S.points+=50;saveLocal(['referredBy','points']);}
    if(!S.referCode&&S.wallet){S.referCode=genCode(S.wallet);saveLocal(['referCode']);}
    render();
  },2000);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proof of Vibe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:28px;margin-bottom:8px}
.sub{color:#888;margin-bottom:30px}
.vibes{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px}
.vibe-btn{padding:20px;border-radius:16px;border:2px solid #222;background:#111;cursor:pointer;font-size:24px;color:white;width:100%}
.vibe-btn span{display:block;font-size:13px;color:#aaa;margin-top:4px}
.result{margin-top:30px;padding:20px;background:#111;border-radius:16px;border:2px solid #6366f1;text-align:center;display:none;max-width:340px;width:100%}
.share-btn{margin-top:12px;padding:10px 24px;background:#6366f1;border:none;border-radius:10px;color:white;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<h1>✨ Proof of Vibe</h1>
<p class="sub">What's your vibe today on Base?</p>
<div class="vibes">
<button class="vibe-btn" onclick="selectVibe('🚀','PUMPED','Ready to moon!')">🚀<span>PUMPED</span></button>
<button class="vibe-btn" onclick="selectVibe('😎','CHILL','Just vibing on Base')">😎<span>CHILL</span></button>
<button class="vibe-btn" onclick="selectVibe('💪','GRIND','Building every day')">💪<span>GRIND</span></button>
<button class="vibe-btn" onclick="selectVibe('🤩','WAGMI','We all gonna make it')">🤩<span>WAGMI</span></button>
<button class="vibe-btn" onclick="selectVibe('😴','TIRED','Need more coffee')">😴<span>TIRED</span></button>
<button class="vibe-btn" onclick="selectVibe('🔥','DEGEN','Full degen mode')">🔥<span>DEGEN</span></button>
</div>
<div class="result" id="result">
<h2 id="vibe-emoji"></h2>
<h2 id="vibe-name"></h2>
<p id="vibe-msg"></p>
<p style="margin-top:8px;font-size:12px;color:#555">Base • Today</p>
<button class="share-btn">Share your Vibe 🚀</button>
</div>
<script>
function selectVibe(emoji,name,msg){
document.getElementById('vibe-emoji').innerText=emoji;
document.getElementById('vibe-name').innerText=name;
document.getElementById('vibe-msg').innerText=msg;
document.getElementById('result').style.display='block';
}
</script>
</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Base Vibe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<style>
:root{
  --base:#0052FF;--base-bright:#4D8EFF;--base-glow:rgba(0,82,255,0.25);
  --bg:#04060F;--surface:#0A0E1A;--surface2:#111827;--surface3:#1A2235;
  --border:rgba(255,255,255,0.07);--border-active:rgba(0,82,255,0.5);
  --text:#F0F4FF;--muted:#5A6A8A;--gold:#FFB800;--green:#00E5A0;--red:#FF4D6A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(0,82,255,0.12) 0%,transparent 70%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;padding-bottom:90px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;position:sticky;top:0;background:rgba(4,6,15,0.92);backdrop-filter:blur(20px);z-index:100;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--base);display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px var(--base-glow);flex-shrink:0;overflow:hidden;position:relative}
.logo-icon svg{width:20px;height:20px}
.logo-text{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-0.3px}
.logo-text span{color:var(--base-bright)}
.wallet-chip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border-active);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--base-bright);cursor:pointer;font-family:'Inter',sans-serif}
.wallet-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,14,26,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;padding:10px 0 14px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border:none;background:none;color:var(--muted);font-family:'Inter',sans-serif;transition:all 0.2s}
.nav-item.active{color:var(--base-bright)}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}

.page{padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px}
.card.glow{border-color:var(--border-active);box-shadow:0 0 24px var(--base-glow)}
.card.gold-glow{border-color:rgba(255,184,0,0.35);box-shadow:0 0 24px rgba(255,184,0,0.1)}
.page-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;letter-spacing:-0.3px}
.page-sub{color:var(--muted);font-size:13px;font-weight:400;margin-bottom:18px}
.section-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center}
.stat-num{font-size:26px;font-weight:800;color:var(--base-bright);line-height:1.1;margin-bottom:4px;display:block}
.stat-label{font-size:11px;font-weight:500;color:var(--muted);display:block}

.vibe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.vibe-btn{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 8px 14px;cursor:pointer;text-align:center;transition:all 0.18s;color:var(--text);font-family:'Inter',sans-serif}
.vibe-btn:active{transform:scale(0.94)}
.vibe-btn.selected{border-color:var(--base-bright);background:linear-gradient(135deg,rgba(0,82,255,0.15),rgba(77,142,255,0.08));box-shadow:0 0 16px var(--base-glow)}
.vibe-emoji{font-size:28px;display:block;margin-bottom:6px;line-height:1}
.vibe-name{font-size:10px;font-weight:700;letter-spacing:0.8px;color:var(--muted);text-transform:uppercase;display:block}
.vibe-btn.selected .vibe-name{color:var(--base-bright)}

.checkin-confirm{background:linear-gradient(135deg,rgba(0,82,255,0.1),rgba(0,229,160,0.05));border:1px solid var(--border-active);border-radius:16px;padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.confirm-emoji{font-size:42px;line-height:1;flex-shrink:0}
.confirm-vibe{font-size:17px;font-weight:800;color:var(--text);display:block}
.confirm-sub{font-size:12px;font-weight:400;color:var(--muted);margin-top:3px;display:block}

.btn-primary{width:100%;padding:15px;background:var(--base);border:none;border-radius:14px;color:white;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.18s;display:block}
.btn-primary:active{transform:scale(0.97);background:#0047E0}
.btn-secondary{width:100%;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.18s;margin-top:10px;display:block}
.btn-green{width:100%;padding:15px;background:#00875A;border:none;border-radius:14px;color:white;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.18s;display:block}
.btn-green:active{transform:scale(0.97)}
.btn-usdc{width:100%;padding:15px;background:#2775CA;border:none;border-radius:14px;color:white;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.18s;margin-top:10px;display:block}
.btn-usdc:active{transform:scale(0.97)}

.checked-banner{background:linear-gradient(135deg,rgba(0,229,160,0.08),rgba(0,82,255,0.06));border:1px solid rgba(0,229,160,0.2);border-radius:16px;padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.check-icon{font-size:32px;line-height:1;flex-shrink:0}
.check-title{font-size:16px;font-weight:800;color:var(--green);display:block}
.check-sub{font-size:12px;font-weight:400;color:var(--muted);margin-top:3px;display:block}

.onchain-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(0,82,255,0.1);border:1px solid rgba(0,82,255,0.25);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--base-bright);margin-bottom:14px}
.onchain-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.quiz-counter{font-size:13px;font-weight:500;color:var(--muted)}
.quiz-pts{font-size:13px;font-weight:700;color:var(--gold)}
.progress-track{height:4px;background:var(--surface2);border-radius:4px;margin-bottom:22px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--base),var(--base-bright));border-radius:4px;transition:width 0.4s ease}
.question-text{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:18px;color:var(--text)}
.options-list{display:flex;flex-direction:column;gap:10px}
.opt-btn{padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);text-align:left;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:12px;width:100%}
.opt-letter{width:28px;height:28px;border-radius:8px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--muted)}
.opt-btn.correct{border-color:var(--green);background:rgba(0,229,160,0.08)}
.opt-btn.correct .opt-letter{background:var(--green);color:var(--bg)}
.opt-btn.wrong{border-color:var(--red);background:rgba(255,77,106,0.08)}
.opt-btn.wrong .opt-letter{background:var(--red);color:white}

.quiz-result{text-align:center;padding:10px}
.result-emoji{font-size:56px;display:block;margin-bottom:12px;line-height:1}
.result-score{font-size:60px;font-weight:800;color:var(--gold);letter-spacing:-2px;line-height:1;display:block}
.result-label{color:var(--muted);font-size:13px;font-weight:400;margin-top:6px;display:block}
.result-breakdown{display:flex;justify-content:center;gap:20px;margin:18px 0;padding:16px;background:var(--surface2);border-radius:12px}
.breakdown-item{text-align:center}
.breakdown-num{font-size:22px;font-weight:800;line-height:1;margin-bottom:4px;display:block}
.breakdown-sub{font-size:11px;font-weight:500;color:var(--muted);display:block}

.lb-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px}
.lb-item.me{border-color:var(--border-active);background:linear-gradient(135deg,rgba(0,82,255,0.08),rgba(77,142,255,0.04))}
.lb-rank-badge{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;background:var(--surface2);color:var(--muted)}
.lb-rank-badge.r1{background:rgba(255,184,0,0.12);color:var(--gold);font-size:20px}
.lb-rank-badge.r2{background:rgba(200,200,200,0.08);color:#C0C0C0;font-size:20px}
.lb-rank-badge.r3{background:rgba(205,127,50,0.1);color:#CD7F32;font-size:20px}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lb-detail{font-size:11px;font-weight:400;color:var(--muted);margin-top:2px;display:block}
.lb-pts{font-size:16px;font-weight:800;color:var(--base-bright);white-space:nowrap;display:block}
.lb-streak{font-size:11px;font-weight:400;color:var(--muted);text-align:right;display:block}

.badges-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;opacity:0.35;transition:all 0.2s}
.badge-card.earned{opacity:1;border-color:rgba(255,184,0,0.35);background:linear-gradient(135deg,rgba(255,184,0,0.07),rgba(255,184,0,0.02));box-shadow:0 0 16px rgba(255,184,0,0.07)}
.badge-icon{font-size:30px;display:block;margin-bottom:8px;line-height:1}
.badge-name{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--text);display:block}
.badge-req{font-size:11px;font-weight:400;color:var(--muted);display:block}

.history-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.history-row:last-child{border-bottom:none}
.history-left{display:flex;align-items:center;gap:10px}
.history-emoji-wrap{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.history-name{font-size:13px;font-weight:600;color:var(--text);display:block}
.history-date{font-size:11px;font-weight:400;color:var(--muted);display:block}

.profile-header{text-align:center;padding:20px 20px 12px}
.profile-avatar{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--base),var(--base-bright));display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;box-shadow:0 0 24px var(--base-glow)}
.profile-name{font-size:22px;font-weight:800;letter-spacing:-0.3px;color:var(--text);display:block}
.profile-addr{font-size:12px;font-weight:400;color:var(--muted);margin-top:4px;display:block}

.connect-screen{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.connect-title{font-size:30px;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px;color:var(--text)}
.connect-title span{color:var(--base-bright)}
.connect-sub{color:var(--muted);font-size:14px;font-weight:400;line-height:1.7;margin-bottom:28px;max-width:280px}
.feature-list{width:100%;max-width:320px;margin-bottom:28px}
.feature-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;text-align:left}
.feature-icon{font-size:20px;flex-shrink:0;line-height:1}
.feature-text{font-size:13px;font-weight:600;color:var(--text);display:block}
.feature-sub{font-size:11px;font-weight:400;color:var(--muted);display:block}
.connect-hint{font-size:11px;font-weight:400;color:var(--muted);margin-top:10px}

.name-setup{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.setup-head{text-align:center;margin-bottom:28px;width:100%;max-width:360px}
.setup-emoji{font-size:48px;margin-bottom:12px;line-height:1;display:block}
.setup-title{font-size:26px;font-weight:800;letter-spacing:-0.3px;color:var(--text);display:block}
.setup-sub{color:var(--muted);font-size:13px;font-weight:400;margin-top:6px;display:block}
.text-input{width:100%;padding:16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;font-weight:600;outline:none;transition:border 0.2s;margin-bottom:10px}
.text-input:focus{border-color:var(--base-bright)}
.text-input::placeholder{color:var(--muted);font-weight:400}

.tx-overlay{position:fixed;inset:0;background:rgba(4,6,15,0.92);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spinner{width:44px;height:44px;border:3px solid var(--surface3);border-top-color:var(--base);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.tx-label{font-size:15px;font-weight:700;color:var(--text)}
.tx-sub{font-size:12px;font-weight:400;color:var(--muted);margin-top:6px}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border-active);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;z-index:200;animation:toastIn 0.3s ease,toastOut 0.3s ease 2.2s forwards;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.4);color:var(--text)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.3s ease forwards}

.pay-divider{display:flex;align-items:center;gap:10px;margin:8px 0}
.pay-divider span{font-size:11px;font-weight:500;color:var(--muted)}
.pay-divider::before,.pay-divider::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S={
  streak:parseInt(localStorage.getItem('streak')||'0'),
  points:parseInt(localStorage.getItem('points')||'0'),
  quizzes:parseInt(localStorage.getItem('quizzes')||'0'),
  lastCheckin:localStorage.getItem('lastCheckin')||'',
  vibeHistory:JSON.parse(localStorage.getItem('vibeHistory')||'[]'),
  quizDone:localStorage.getItem('quizDone')||'',
  walletAddress:localStorage.getItem('walletAddress')||'',
  username:localStorage.getItem('username')||'',
  tab:'vibe',
  selectedVibe:null,
  currentQ:0,
  quizScore:0,
  quizAnswered:false,
  totalCorrect:0,
};

function save(keys){keys.forEach(function(k){if(k==='vibeHistory')localStorage.setItem(k,JSON.stringify(S[k]));else localStorage.setItem(k,String(S[k]));});}

var QUESTIONS=[
  {q:"What is Base?",opts:["A Bitcoin Layer 2","An Ethereum L2 by Coinbase","A new L1 blockchain","A DeFi protocol"],a:1},
  {q:"Who built and launched Base?",opts:["Ethereum Foundation","Binance","Coinbase","Polygon Labs"],a:2},
  {q:"What technology stack does Base use?",opts:["ZK Rollup","OP Stack (Optimism)","Arbitrum Nitro","Polygon CDK"],a:1},
  {q:"What is the native gas token on Base?",opts:["$BASE","$USDC","$ETH","$OP"],a:2},
  {q:"Base mainnet launched publicly in which year?",opts:["2021","2022","2023","2024"],a:2},
  {q:"What is OnchainKit?",opts:["A Base wallet app","Open-source toolkit for onchain apps","A Base governance token","A DeFi protocol"],a:1},
  {q:"What is MiniKit used for?",opts:["Mining crypto on Base","Building mini apps on Base","Sending NFTs","Trading tokens"],a:1},
  {q:"Base is part of which broader vision?",opts:["Ethereum 2.0","The Superchain by Optimism","Web3 Alliance","DeFi Summer 2.0"],a:1},
  {q:"What does 'onchain' mean in Base context?",opts:["Stored on centralized servers","Data recorded on blockchain","Encrypted off-chain data","Offline storage"],a:1},
  {q:"What is Farcaster?",opts:["A Base governance token","A decentralized social protocol","A Base DeFi app","A Base hardware wallet"],a:1}
];

var VIBES=[
  {emoji:'🚀',name:'PUMPED'},{emoji:'😎',name:'CHILL'},{emoji:'💪',name:'GRIND'},
  {emoji:'🤩',name:'WAGMI'},{emoji:'😴',name:'TIRED'},{emoji:'🔥',name:'DEGEN'},
  {emoji:'😠',name:'ANGRY'},{emoji:'😢',name:'CRYING'},{emoji:'😊',name:'HAPPY'}
];

var LEADERBOARD=[
  {name:'basebuilder.eth',pts:980,streak:14,rank:'r1',medal:'🥇'},
  {name:'cryptovibe.eth',pts:870,streak:11,rank:'r2',medal:'🥈'},
  {name:'onchainmaxi.eth',pts:760,streak:9,rank:'r3',medal:'🥉'},
  {name:'wagmifrens.eth',pts:650,streak:7,rank:'',medal:'4'},
  {name:'degenlife.eth',pts:540,streak:5,rank:'',medal:'5'},
];

var BADGES=[
  {icon:'👑',name:'OG Vibe',req:'First check-in',earned:function(){return S.streak>=1}},
  {icon:'🔥',name:'7 Day Streak',req:'7 days in a row',earned:function(){return S.streak>=7}},
  {icon:'⚡',name:'Base Native',req:'30 day streak',earned:function(){return S.streak>=30}},
  {icon:'🧠',name:'Quiz Master',req:'Complete 5 quizzes',earned:function(){return S.quizzes>=5}},
  {icon:'💯',name:'Perfect Score',req:'10/10 on a quiz',earned:function(){return S.totalCorrect>=10}},
  {icon:'🏆',name:'Top Vibe',req:'Reach 500 points',earned:function(){return S.points>=500}},
];

// USDC contract on Base
var USDC_ADDRESS='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
var USDC_ABI=['function transfer(address to,uint256 amount) returns(bool)'];

function shortAddr(a){return a?a.slice(0,6)+'...'+a.slice(-4):'';}

function toast(msg){
  var t=document.createElement('div');
  t.className='toast';t.innerText=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2500);
}

function showLoading(msg){
  var o=document.createElement('div');
  o.className='tx-overlay';o.id='tx-overlay';
  o.innerHTML='<div class="spinner"></div><div class="tx-label">'+(msg||'Processing...')+'</div><div class="tx-sub">Please wait...</div>';
  document.body.appendChild(o);
}

function hideLoading(){
  var o=document.getElementById('tx-overlay');
  if(o)o.remove();
}

function logoSVG(){
  return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="12" fill="#0052FF"/><path d="M12 4C7.58 4 4 7.58 4 12C4 16.42 7.58 20 12 20C14.76 20 17.19 18.63 18.66 16.5H13.5C12.12 16.5 11 15.38 11 14V10C11 8.62 12.12 7.5 13.5 7.5H18.66C17.19 5.37 14.76 4 12 4Z" fill="white"/><circle cx="16" cy="12" r="3" fill="#0052FF"/></svg>';
}

async function connectWallet(){
  if(typeof window.ethereum==='undefined'){
    toast('Open in Coinbase Wallet browser!');return;
  }
  try{
    showLoading('Connecting wallet...');
    var accounts=await window.ethereum.request({method:'eth_requestAccounts'});
    S.walletAddress=accounts[0];
    localStorage.setItem('walletAddress',S.walletAddress);
    try{
      await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x2105'}]});
    }catch(e){
      await window.ethereum.request({method:'wallet_addEthereumChain',params:[{
        chainId:'0x2105',chainName:'Base',
        nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},
        rpcUrls:['https://mainnet.base.org'],
        blockExplorerUrls:['https://basescan.org']
      }]});
    }
    hideLoading();
    renderSetupName();
  }catch(e){hideLoading();toast('Connection failed');}
}

function renderSetupName(){
  var html='<div class="name-setup fade-up">';
  html+='<div class="setup-head">';
  html+='<span class="setup-emoji">✨</span>';
  html+='<span class="setup-title">Welcome to Base Vibe!</span>';
  html+='<span class="setup-sub">Wallet: '+shortAddr(S.walletAddress)+'</span>';
  html+='</div>';
  html+='<div style="width:100%;max-width:360px">';
  html+='<div class="section-label">Choose your username</div>';
  html+='<input class="text-input" id="uname" type="text" placeholder="Enter name or ENS..." maxlength="20">';
  html+='<div style="color:var(--muted);font-size:11px;margin-bottom:16px">This shows on the leaderboard</div>';
  html+='<button class="btn-primary" onclick="saveUsername()">Let\'s Go →</button>';
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}

function saveUsername(){
  var v=document.getElementById('uname').value.trim();
  if(!v){toast('Enter a name!');return;}
  S.username=v;
  localStorage.setItem('username',v);
  render('vibe');
}

function disconnectWallet(){
  if(!confirm('Disconnect wallet?'))return;
  S.walletAddress='';S.username='';
  localStorage.removeItem('walletAddress');
  localStorage.removeItem('username');
  render('vibe');
}

async function doETHTransaction(){
  if(!S.walletAddress){toast('Connect wallet first!');return;}
  try{
    showLoading('Sending ETH check-in on Base...');
    var provider=new ethers.BrowserProvider(window.ethereum);
    var signer=await provider.getSigner();
    var tx=await signer.sendTransaction({
      to:'0x000000000000000000000000000000000000dEaD',
      value:ethers.parseEther('0.0001'),
    });
    await tx.wait();
    hideLoading();
    doCheckIn();
    toast('✅ Checked in with ETH!');
  }catch(e){hideLoading();toast('Failed: '+e.message.slice(0,50));}
}

async function doUSDCTransaction(){
  if(!S.walletAddress){toast('Connect wallet first!');return;}
  try{
    showLoading('Sending USDC check-in on Base...');
    var provider=new ethers.BrowserProvider(window.ethereum);
    var signer=await provider.getSigner();
    var contract=new ethers.Contract(USDC_ADDRESS,USDC_ABI,signer);
    // 0.01 USDC = 10000 (6 decimals)
    var tx=await contract.transfer('0x000000000000000000000000000000000000dEaD',10000);
    await tx.wait();
    hideLoading();
    doCheckIn();
    toast('✅ Checked in with USDC!');
  }catch(e){hideLoading();toast('Failed: '+e.message.slice(0,50));}
}

function doCheckIn(){
  var today=new Date().toDateString();
  var yesterday=new Date(Date.now()-86400000).toDateString();
  if(S.lastCheckin===today){toast('Already checked in today!');return;}
  if(S.lastCheckin===yesterday)S.streak++;
  else S.streak=1;
  S.lastCheckin=today;
  S.points+=10;
  save(['streak','points','lastCheckin']);
  render('vibe');
}

function topbar(){
  var html='<div class="topbar">';
  html+='<div class="logo">';
  html+='<div class="logo-icon">'+logoSVG()+'</div>';
  html+='<div class="logo-text">Base<span>Vibe</span></div>';
  html+='</div>';
  if(S.walletAddress){
    var name=S.username||shortAddr(S.walletAddress);
    html+='<div class="wallet-chip" onclick="disconnectWallet()"><div class="wallet-dot"></div>'+name+'</div>';
  }else{
    html+='<button class="wallet-chip" onclick="connectWallet()">🔗 Connect</button>';
  }
  html+='</div>';
  return html;
}

function bottomNav(){
  var tabs=[{id:'vibe',icon:'😎',label:'Vibe'},{id:'quiz',icon:'🧠',label:'Quiz'},{id:'lb',icon:'🏆',label:'Board'},{id:'profile',icon:'👤',label:'Me'}];
  var html='<div class="bottom-nav">';
  tabs.forEach(function(t){
    html+='<button class="nav-item'+(S.tab===t.id?' active':'')+'" onclick="render(\''+t.id+'\')">';
    html+='<span class="nav-icon">'+t.icon+'</span>';
    html+='<span class="nav-label">'+t.label+'</span>';
    html+='</button>';
  });
  html+='</div>';
  return html;
}

function renderVibe(){
  var today=new Date().toDateString();
  var checkedIn=S.lastCheckin===today;
  var html='<div class="page fade-up">';
  if(checkedIn){
    html+='<div class="checked-banner"><div class="check-icon">🔥</div><div><span class="check-title">Checked In Today!</span><span class="check-sub">'+S.streak+' day streak • +10 pts earned</span></div></div>';
    html+='<div class="stats-row">';
    html+='<div class="stat-card"><span class="stat-num">'+S.streak+'</span><span class="stat-label">Streak</span></div>';
    html+='<div class="stat-card"><span class="stat-num">'+S.points+'</span><span class="stat-label">Points</span></div>';
    html+='<div class="stat-card"><span class="stat-num">'+S.quizzes+'</span><span class="stat-label">Quizzes</span></div>';
    html+='</div>';
    html+='<button class="btn-primary" onclick="render(\'quiz\')">Take Today\'s Quiz 🧠</button>';
  }else{
    html+='<div class="onchain-tag"><div class="onchain-dot"></div>Daily Onchain Check-in</div>';
    html+='<div class="page-title">What\'s your vibe?</div>';
    html+='<div class="page-sub">Pick your mood to start your streak</div>';
    html+='<div class="vibe-grid">';
    VIBES.forEach(function(v){
      var sel=S.selectedVibe&&S.selectedVibe.name===v.name?' selected':'';
      html+='<button class="vibe-btn'+sel+'" onclick="pickVibe(\''+v.emoji+'\',\''+v.name+'\')">';
      html+='<span class="vibe-emoji">'+v.emoji+'</span>';
      html+='<span class="vibe-name">'+v.name+'</span>';
      html+='</button>';
    });
    html+='</div>';
    if(S.selectedVibe){
      html+='<div class="checkin-confirm">';
      html+='<div class="confirm-emoji">'+S.selectedVibe.emoji+'</div>';
      html+='<div><span class="confirm-vibe">'+S.selectedVibe.name+'</span><span class="confirm-sub">Base • '+today+'</span></div>';
      html+='</div>';
      if(S.walletAddress){
        html+='<button class="btn-green" onclick="doETHTransaction()">✅ Check In with ETH (0.0001 ETH)</button>';
        html+='<div class="pay-divider"><span>or</span></div>';
        html+='<button class="btn-usdc" onclick="doUSDCTransaction()">💵 Check In with USDC (0.01 USDC)</button>';
      }else{
        html+='<button class="btn-primary" onclick="connectWallet()">🔗 Connect Wallet to Check In</button>';
      }
    }
  }
  html+='</div>';
  return html;
}

function renderQuiz(){
  var today=new Date().toDateString();
  var html='<div class="page fade-up">';
  html+='<div class="page-title">Base Quiz</div>';
  html+='<div class="page-sub">10 questions • 10 pts each</div>';
  if(S.quizDone===today){
    html+='<div class="card glow quiz-result">';
    html+='<span class="result-emoji">✅</span>';
    html+='<div style="font-size:20px;font-weight:800;margin-bottom:8px">Quiz Complete!</div>';
    html+='<div style="color:var(--muted);font-size:13px">Come back tomorrow!</div>';
    html+='<div class="result-breakdown">';
    html+='<div class="breakdown-item"><span class="breakdown-num" style="color:var(--gold)">'+S.points+'</span><span class="breakdown-sub">Total pts</span></div>';
    html+='<div class="breakdown-item"><span class="breakdown-num" style="color:var(--green)">'+S.streak+'</span><span class="breakdown-sub">Streak</span></div>';
    html+='<div class="breakdown-item"><span class="breakdown-num" style="color:var(--base-bright)">'+S.quizzes+'</span><span class="breakdown-sub">Quizzes</span></div>';
    html+='</div>';
    html+='<button class="btn-primary" onclick="render(\'lb\')">View Leaderboard 🏆</button>';
    html+='</div>';
  }else if(S.currentQ>=QUESTIONS.length){
    html+='<div class="card gold-glow quiz-result">';
    html+='<span class="result-emoji">🎉</span>';
    html+='<span class="result-score">+'+S.quizScore+'</span>';
    html+='<span class="result-label">points earned this quiz</span>';
    html+='<div class="result-breakdown">';
    html+='<div class="breakdown-item"><span class="breakdown-num" style="color:var(--green)">'+S.totalCorrect+'</span><span class="breakdown-sub">Correct</span></div>';
    html+='<div class="breakdown-item"><span class="breakdown-num" style="color:var(--red)">'+(10-S.totalCorrect)+'</span><span class="breakdown-sub">Wrong</span></div>';
    html+='<div class="breakdown-item"><span class="breakdown-num" style="color:var(--gold)">'+S.points+'</span><span class="breakdown-sub">Total pts</span></div>';
    html+='</div>';
    html+='<button class="btn-primary" onclick="render(\'lb\')">View Leaderboard 🏆</button>';
    html+='</div>';
  }else{
    var q=QUESTIONS[S.currentQ];
    var letters=['A','B','C','D'];
    html+='<div class="card glow">';
    html+='<div class="quiz-header"><span class="quiz-counter">Question '+(S.currentQ+1)+' / '+QUESTIONS.length+'</span><span class="quiz-pts">+'+S.quizScore+' pts</span></div>';
    html+='<div class="progress-track"><div class="progress-fill" style="width:'+(S.currentQ/QUESTIONS.length*100)+'%"></div></div>';
    html+='<div class="question-text">'+q.q+'</div>';
    html+='<div class="options-list">';
    q.opts.forEach(function(o,i){
      html+='<button class="opt-btn" id="opt'+i+'" onclick="answerQ('+i+')">';
      html+='<span class="opt-letter">'+letters[i]+'</span>'+o;
      html+='</button>';
    });
    html+='</div></div>';
  }
  html+='</div>';
  return html;
}

function renderLB(){
  var myName=S.username||shortAddr(S.walletAddress)||'You';
  var html='<div class="page fade-up">';
  html+='<div class="page-title">Leaderboard</div>';
  html+='<div class="page-sub">Top Base Vibers this week</div>';
  LEADERBOARD.forEach(function(p){
    html+='<div class="lb-item">';
    html+='<div class="lb-rank-badge '+p.rank+'">'+p.medal+'</div>';
    html+='<div class="lb-info"><span class="lb-name">'+p.name+'</span><span class="lb-detail">🔥 '+p.streak+' day streak</span></div>';
    html+='<div><span class="lb-pts">'+p.pts+'</span><span class="lb-streak">pts</span></div>';
    html+='</div>';
  });
  html+='<div class="lb-item me">';
  html+='<div class="lb-rank-badge">?</div>';
  html+='<div class="lb-info"><span class="lb-name">'+myName+' (You)</span><span class="lb-detail">🔥 '+S.streak+' day streak</span></div>';
  html+='<div><span class="lb-pts">'+S.points+'</span><span class="lb-streak">pts</span></div>';
  html+='</div>';
  html+='</div>';
  return html;
}

function renderProfile(){
  var myName=S.username||shortAddr(S.walletAddress)||'Base Vibe Player';
  var html='<div class="page fade-up">';
  html+='<div class="profile-header">';
  html+='<div class="profile-avatar">😎</div>';
  html+='<span class="profile-name">'+myName+'</span>';
  if(S.walletAddress)html+='<span class="profile-addr">'+shortAddr(S.walletAddress)+'</span>';
  html+='</div>';
  html+='<div class="stats-row">';
  html+='<div class="stat-card"><span class="stat-num">'+S.streak+'</span><span class="stat-label">Streak</span></div>';
  html+='<div class="stat-card"><span class="stat-num">'+S.points+'</span><span class="stat-label">Points</span></div>';
  html+='<div class="stat-card"><span class="stat-num">'+S.quizzes+'</span><span class="stat-label">Quizzes</span></div>';
  html+='</div>';
  html+='<div class="card">';
  html+='<div class="section-label">🎖️ Badges</div>';
  html+='<div class="badges-grid">';
  BADGES.forEach(function(b){
    var e=b.earned();
    html+='<div class="badge-card'+(e?' earned':'')+'">';
    html+='<span class="badge-icon">'+b.icon+'</span>';
    html+='<span class="badge-name">'+b.name+'</span>';
    html+='<span class="badge-req">'+b.req+'</span>';
    html+='</div>';
  });
  html+='</div></div>';
  html+='<div class="card">';
  html+='<div class="section-label">📊 Vibe History</div>';
  if(S.vibeHistory.length===0){
    html+='<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0">No vibes yet! Start your check-in 🚀</div>';
  }else{
    S.vibeHistory.slice(0,10).forEach(function(v){
      html+='<div class="history-row">';
      html+='<div class="history-left"><div class="history-emoji-wrap">'+v.emoji+'</div>';
      html+='<div><span class="history-name">'+v.name+'</span><span class="history-date">'+v.date+'</span></div></div>';
      html+='</div>';
    });
  }
  html+='</div>';
  if(S.walletAddress){
    html+='<button class="btn-secondary" onclick="disconnectWallet()">Disconnect Wallet</button>';
  }
  html+='</div>';
  return html;
}

function render(tab){
  S.tab=tab;
  var html=topbar();
  if(!S.walletAddress){
    html+='<div class="connect-screen fade-up">';
    html+='<div style="width:64px;height:64px;border-radius:16px;background:var(--base);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 30px var(--base-glow)">'+logoSVG()+'</div>';
    html+='<div class="connect-title">Base<span>Vibe</span></div>';
    html+='<div class="connect-sub">Daily mood check-in on Base blockchain. Build streaks, learn Base, climb the leaderboard.</div>';
    html+='<div class="feature-list">';
    html+='<div class="feature-item"><span class="feature-icon">🔥</span><div><span class="feature-text">Daily Streaks</span><span class="feature-sub">Check in every day onchain</span></div></div>';
    html+='<div class="feature-item"><span class="feature-icon">🧠</span><div><span class="feature-text">Base Quiz</span><span class="feature-sub">10 Base questions daily</span></div></div>';
    html+='<div class="feature-item"><span class="feature-icon">🏆</span><div><span class="feature-text">Leaderboard</span><span class="feature-sub">Compete globally</span></div></div>';
    html+='<div class="feature-item"><span class="feature-icon">⛓️</span><div><span class="feature-text">Pay with ETH or USDC</span><span class="feature-sub">Proof on Base blockchain</span></div></div>';
    html+='</div>';
    html+='<button class="btn-primary" style="max-width:320px;width:100%" onclick="connectWallet()">🔗 Connect Wallet</button>';
    html+='<div class="connect-hint">Open in Coinbase Wallet for best experience</div>';
    html+='</div>';
  }else{
    if(tab==='vibe')html+=renderVibe();
    else if(tab==='quiz')html+=renderQuiz();
    else if(tab==='lb')html+=renderLB();
    else if(tab==='profile')html+=renderProfile();
    html+=bottomNav();
  }
  document.getElementById('app').innerHTML=html;
}

function pickVibe(emoji,name){
  S.selectedVibe={emoji:emoji,name:name};
  var today=new Date().toDateString();
  S.vibeHistory.unshift({date:today,emoji:emoji,name:name});
  if(S.vibeHistory.length>30)S.vibeHistory=S.vibeHistory.slice(0,30);
  save(['vibeHistory']);
  render('vibe');
}

function answerQ(i){
  if(S.quizAnswered)return;
  S.quizAnswered=true;
  var q=QUESTIONS[S.currentQ];
  var opts=document.querySelectorAll('.opt-btn');
  if(i===q.a){
    opts[i].classList.add('correct');
    S.quizScore+=10;S.totalCorrect++;
    toast('✅ Correct! +10 pts');
  }else{
    opts[i].classList.add('wrong');
    opts[q.a].classList.add('correct');
    toast('❌ Wrong!');
  }
  setTimeout(function(){
    S.currentQ++;S.quizAnswered=false;
    if(S.currentQ>=QUESTIONS.length){
      S.points+=S.quizScore;S.quizzes++;
      S.quizDone=new Date().toDateString();
      save(['points','quizzes','quizDone']);
    }
    render('quiz');
  },1200);
}

render('vibe');
</script>
</body>
</html>
